<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلطان العسل - النظام الاحترافي</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="loginScreen" class="login-container">
        <img src="1000031072.png" alt="الشعار" class="login-logo">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()" class="btn-primary">دخول</button>
    </div>

    <div id="appBody" class="app-container" style="display: none;">
        <header class="main-header">
            <h1 class="system-title">سلطان العسل</h1>
            <p id="userWelcome"></p>
            <button onclick="logout()" class="btn-logout">خروج</button>
        </header>

        <section class="smart-section">
            <div class="smart-paste-box">
                <textarea id="smartInput" placeholder="الصق تفاصيل الطلب من سلة..."></textarea>
                <button onclick="processSmartPaste()" class="btn-smart">استخراج البيانات</button>
            </div>
        </section>

        <section class="form-section">
            <div class="input-grid">
                <input type="text" id="custName" placeholder="اسم العميل">
                <input type="text" id="prepEmp" placeholder="مسؤول التجهيز">
                <input type="text" id="orderID" placeholder="رقم الطلب">
                <input type="text" id="trackingID" placeholder="رقم البوليصة">
                <input type="number" id="orderPrice" placeholder="السعر">
                <select id="branchName">
                    <option value="فرع المحالة">فرع المحالة</option>
                    <option value="فرع الروضة">فرع الروضة</option>
                </select>
                <select id="deliveryType">
                    <option value="توصيل مندوب">🛵 توصيل مندوب</option>
                    <option value="شحن سمسا">📦 شحن سمسا</option>
                </select>
                <select id="orderType">
                    <option value="سلة">🛒 طلب سلة</option>
                    <option value="واتساب">💬 طلب واتساب</option>
                </select>
            </div>
            <button onclick="saveOrder()" id="saveBtn" class="btn-primary">حفظ الطلب ✅</button>
        </section>

        <div class="search-section">
            <input type="text" id="searchInput" onkeyup="filterOrders()" placeholder="🔍 ابحث في النشط والأرشيف...">
        </div>

        <div class="admin-actions">
            <button onclick="printAllToday()" class="btn-print-green">⎙ طباعة كل طلبات اليوم</button>
        </div>

        <main class="main-content">
            <div class="list-column">
                <h2 class="section-title">🛒 طلبات سلة</h2>
                <div id="sallaList"></div>
            </div>
            <div class="list-column">
                <h2 class="section-title">💬 طلبات واتساب</h2>
                <div id="whatsappList"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
