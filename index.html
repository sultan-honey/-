<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلطان العسل - النظام المطور</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="loginScreen" class="login-overlay">
        <div class="login-box">
            <img src="1000031072.png" class="login-logo">
            <h2>تسجيل دخول</h2>
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button onclick="login()" class="btn-primary">دخول</button>
        </div>
    </div>

    <div id="appBody" class="app-container" style="display: none;">
        <header class="main-header">
            <button onclick="logout()" class="btn-logout">خروج</button>
            <img src="1000031072.png" class="header-logo">
            <h1 class="system-title">سلطان العسل</h1>
            <div id="userWelcome"></div>
        </header>

        <section class="stats-area">
            <div class="stat-card">
                <h3>طلبات اليوم</h3>
                <p id="totalOrders">0</p>
            </div>
            <div class="stat-card">
                <h3>مبيعات اليوم</h3>
                <p id="totalSales">0 ر.س</p>
            </div>
        </section>

        <section class="smart-paste-area">
            <textarea id="smartInput" placeholder="الصق بيانات طلب سلة هنا..."></textarea>
            <button onclick="processSmartPaste()" class="btn-extract">✨ استخراج البيانات والإجمالي</button>
        </section>

        <section class="form-section">
            <div class="input-grid">
                <input type="text" id="custName" placeholder="👤 اسم العميل">
                <input type="text" id="prepEmp" placeholder="👨‍🍳 مسؤول التجهيز">
                <input type="text" id="orderID" placeholder="🔢 رقم الطلب">
                <input type="text" id="trackingID" placeholder="📄 رقم البوليصة">
                <input type="number" id="orderPrice" placeholder="💰 السعر الإجمالي">
                <select id="branchName">
                    <option>📍 فرع المحالة</option>
                    <option>📍 فرع الروضة</option>
                    <option>📍 فرع التعمير</option>
                </select>
                <select id="deliveryType">
                    <option>🛵 توصيل مندوب</option>
                    <option>📦 شحن سمسا</option>
                    <option>🏠 استلام فرع</option>
                </select>
                <select id="orderType">
                    <option value="سلة">🛒 طلب سلة</option>
                    <option value="واتساب">💬 طلب واتساب</option>
                </select>
            </div>
            <button id="saveBtn" onclick="saveOrder()" class="btn-primary">حفظ الطلب ✅</button>
        </section>

        <div class="tools-area">
            <input type="text" id="searchInput" oninput="filterOrders()" placeholder="🔍 ابحث بالاسم أو الرقم...">
            <div class="admin-btns">
                <button onclick="toggleArchive()" class="btn-gray">📂 الأرشيف</button>
                <button onclick="printAllToday()" class="btn-gold">⎙ طباعة كشف اليوم</button>
            </div>
        </div>

        <div id="adminDashboard" style="display: none; background: #fff; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #b48608; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h2 style="color: #b48608; text-align: center; margin-bottom: 20px;">👑 لوحة تحكم الإدارة (إبراهيم)</h2>

            <div style="background: #fdfdfd; padding: 15px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <strong style="color: #333; flex-shrink: 0;">⎙ طباعة طلبات يوم محدد:</strong>
                <input type="date" id="customPrintDate" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; flex: 1; min-width: 150px;">
                <button onclick="printCustomDate()" style="background: #17a2b8; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">طباعة الكشف</button>
            </div>

            <div style="display: flex; gap: 15px; text-align: center; margin-bottom: 20px; flex-wrap: wrap;">
                <div style="flex: 1; background: #f8f9fa; padding: 15px; border-radius: 10px; border: 1px solid #ddd; min-width: 120px;">
                    <h3 style="font-size: 14px; color: #555;">إجمالي الطلبات الكلي</h3>
                    <p id="countAll" style="font-size: 24px; font-weight: bold; color: #333;">0</p>
                </div>
                <div style="flex: 1; background: #e3f2fd; padding: 15px; border-radius: 10px; border: 1px solid #90caf9; min-width: 120px;">
                    <h3 style="font-size: 14px; color: #1976d2;">إجمالي طلبات عمر</h3>
                    <p id="countOmar" style="font-size: 24px; font-weight: bold; color: #1976d2;">0</p>
                </div>
                <div style="flex: 1; background: #fce4ec; padding: 15px; border-radius: 10px; border: 1px solid #f48fb1; min-width: 120px;">
                    <h3 style="font-size: 14px; color: #c2185b;">إجمالي طلبات مريم</h3>
                    <p id="countMaryam" style="font-size: 24px; font-weight: bold; color: #c2185b;">0</p>
                </div>
            </div>

            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div style="flex: 1; border: 2px solid #90caf9; border-radius: 10px; padding: 15px; background: #fafcff; min-width: 250px;">
                    <h3 style="color: #1976d2; margin-bottom: 15px; border-bottom: 2px solid #90caf9; padding-bottom: 5px;">📦 طلبات عمر</h3>
                    <div id="omarList" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
                <div style="flex: 1; border: 2px solid #f48fb1; border-radius: 10px; padding: 15px; background: #fffafc; min-width: 250px;">
                    <h3 style="color: #c2185b; margin-bottom: 15px; border-bottom: 2px solid #f48fb1; padding-bottom: 5px;">📦 طلبات مريم</h3>
                    <div id="maryamList" style="max-height: 400px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>
        <main class="lists-wrapper">
            <div class="list-col">
                <h2 class="list-title">🛒 سلة</h2>
                <div id="sallaList"></div>
            </div>
            <div class="list-col">
                <h2 class="list-title">💬 واتساب</h2>
                <div id="whatsappList"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
