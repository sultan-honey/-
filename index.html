<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام سلطان العسل</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="loginScreen" class="login-container">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="الموظف"><br>
        <input type="password" id="password" placeholder="كلمة المرور"><br>
        <button onclick="login()" class="btn-primary">دخول</button>
    </div>

    <div id="appBody" style="display:none;" class="app-container">
        <div class="stats-container">
            <div class="stat-card"><h3>إجمالي الطلبات</h3><p id="statTotalOrders">0</p></div>
            <div class="stat-card"><h3>إجمالي المبيعات</h3><p id="statTotalSales">0</p></div>
            <div class="stat-card omar"><h3>طلبات عمر</h3><p id="statOmar">0</p></div>
            <div class="stat-card maryam"><h3>طلبات مريم</h3><p id="statMaryam">0</p></div>
        </div>

        <section class="form-section">
            <textarea id="smartInput" oninput="processSmartPaste()" placeholder="الصق نص سلة هنا للاستخراج التلقائي..."></textarea>
            <div class="input-grid">
                <input type="text" id="custName" placeholder="اسم العميل">
                <input type="text" id="orderID" placeholder="رقم الطلب">
                <input type="text" id="trackingID" placeholder="البوليصة">
                <input type="number" id="orderPrice" placeholder="السعر">
                <input type="text" id="prepEmp" placeholder="المجهز">
                <select id="deliveryType">
                    <option value="شحن سمسا">📦 شحن سمسا</option>
                    <option value="توصيل مندوب">🛵 توصيل مندوب</option>
                </select>
                <select id="branchName"><option value="المحالة">فرع المحالة</option></select>
                <select id="orderType"><option value="سلة">🛒 سلة</option><option value="واتساب">💬 واتساب</option></select>
            </div>
            <button onclick="saveOrder()" id="saveBtn" class="btn-primary">حفظ الطلب ✅</button>
        </section>

        <div class="filter-section">
            <span>اختر اليوم:</span>
            <input type="date" id="calendarFilter" onchange="loadData()">
            <input type="text" id="searchInput" onkeyup="loadData()" placeholder="🔍 ابحث بالاسم أو الرقم في كل البيانات...">
            <button onclick="printAllVisible()" class="btn-smart" style="width:auto; padding:10px 20px; margin:0;">⎙ طباعة طلبات اليوم المختار</button>
            <button onclick="logout()" style="background:#ff4d4d; color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">خروج</button>
        </div>

        <main class="main-content">
            <div class="list-column"><h2 class="section-title">🛒 سلة</h2><div id="sallaList"></div></div>
            <div class="list-column"><h2 class="section-title">💬 واتساب</h2><div id="whatsappList"></div></div>
        </main>
    </div>
    <script id="userWelcome"></script>
    <script src="script.js"></script>
</body>
</html>
